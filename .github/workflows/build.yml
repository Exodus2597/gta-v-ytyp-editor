name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build, test, and package
        shell: pwsh
        run: ./scripts/build.ps1 -Test
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation
          path: |
            artifacts/publish/test-results.txt
            artifacts/publish/*preview.png
